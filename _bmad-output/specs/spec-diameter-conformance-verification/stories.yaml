- id: "1"
  title: Repair the story 3-9 verification layer
  description: >-
    Make the identifier tests measure identifiers (string equality,
    consecutiveness, seeded first frame, 2^20 carry), check every buffer
    extension in the writer data paths, correct the public claims that
    contradict the tree, and record stories 6 and 9 plus the deferred ledger
    truthfully, satisfying CAP-1 through CAP-4.
  invoke_dev_with: >-
    Work directly on spec/diameter-rfc-conformance and land it in one pull
    request. Findings with evidence are in findings.md (V-1 through V-13).
    Keep the wire format unchanged: the only behaviour change is the
    allocation-failure null check. Do not change the padding decision or the
    encap-padding bytes. Keep the man-page phrases `seeded once from
    click_random()` and `unique for the first 2^32 messages of a run`. Prove the
    new checks discriminate: the advance-on-refusal and seed+1 mutants must
    fail, and the pre-change package must fail the first-frame and
    consecutiveness assertions. Build with `-Wall -Wextra` and run the whole
    bats suite.

- id: "2"
  title: Close the six deferred items
  description: >-
    Add the M=1 decode/re-encode and zero-draw observations, reject repeated
    keyword arguments package-wide, add the missing three-octet Length guards to
    DiameterEncap, DiameterPopStorePushAVP and DiameterAvpEncap, and cap the
    RAND*STRING counts at configure time, closing DW-1 through DW-6.
  invoke_dev_with: >-
    Work on spec/diameter-rfc-conformance and keep the commit on it. DW-1 and
    DW-3 are test-only; DW-2 is a deliberate behaviour change (a repeated
    keyword now fails configuration, naming it); DW-4, DW-5 and DW-6 add the
    run-time and configure-time ceilings. Keep the warnings in the
    `ELEMENT: dropping packet: ...` style, keep the stored AVP on a
    PopStorePush overflow, and pin every path with a config. Build with
    `-Wall -Wextra` and run the whole bats suite.
